name: Noindex private EXPLORE pages

on:
  push:
    paths:
      - '.github/workflows/noindex-private-explore.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add noindex to private pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['pin-core.html','cockpit.html']:
              p=Path(name); s=p.read_text()
              assert '<head>' in s and '<meta name="robots"' not in s, f'{name}: unexpected current state'
              s=s.replace('<head>','<head>\n  <meta name="robots" content="noindex,nofollow"/>',1)
              p.write_text(s)
          Path('.github/workflows/noindex-private-explore.yml').unlink()
          PY
      - name: Commit noindex and cleanup workflow
        shell: bash
        run: |
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Protéger les portes privées EXPLORE de l'indexation"
          git push
