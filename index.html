      fr:{eyebrow:"EXPLORE PRO · espace sécurisé",hello:"Bonjour.",welcome:"Bonjour, {name}.",sub:"Ta fiche lieu est synchronisée avec Supabase et reste disponible sur tes appareils.",published:"Ton lieu est publié et son QR individuel est prêt.",draft:"Ton lieu est enregistré. Active « Publier » dans Ma fiche lieu pour ouvrir la fiche client.",fiche:"Ma fiche lieu",qr:"Mon QR",pub:"Voir EXPLORE public",share:"Partager sur WhatsApp",hub:"Retour au HUB",foot:"0% commission · relation directe · données publiques séparées du PIN",migration:"La migration Supabase EXPLORE doit être exécutée avant la synchronisation.",empty:"Aucune fiche cloud pour ce compte. Ouvre Ma fiche lieu pour la créer.",prepare:"Prépare et enregistre d’abord ta fiche lieu.",publish:"Publie d’abord la fiche avant de la partager.",message:"Bonjour, voici {name} sur DIGIY EXPLORE : {url}",professional:"professionnel"},

      es:{eyebrow:"EXPLORE PRO · espacio seguro",hello:"Hola.",welcome:"Hola, {name}.",sub:"La ficha de tu lugar está sincronizada con Supabase y disponible en tus dispositivos.",published:"Tu lugar está publicado y su QR individual está listo.",draft:"Tu lugar está guardado. Activa «Publicar» en Mi ficha del lugar para abrir la página visitante.",fiche:"Mi ficha del lugar",qr:"Mi QR",pub:"Ver EXPLORE público",share:"Compartir por WhatsApp",hub:"Volver al HUB",foot:"0% comisión · relación directa · datos públicos separados del PIN",migration:"La migración Supabase EXPLORE debe ejecutarse antes de sincronizar.",empty:"No existe ficha cloud para esta cuenta. Abre Mi ficha del lugar para crearla.",prepare:"Prepara y guarda primero la ficha del lugar.",publish:"Publica la ficha antes de compartirla.",message:"Hola, aquí está {name} en DIGIY EXPLORE: {url}",professional:"profesional"},
      de:{eyebrow:"EXPLORE PRO · geschützter Bereich",hello:"Hallo.",welcome:"Hallo, {name}.",sub:"Dein Ortsprofil ist mit Supabase synchronisiert und auf deinen Geräten verfügbar.",published:"Dein Ort ist veröffentlicht und sein individueller QR ist bereit.",draft:"Dein Ort ist gespeichert. Aktiviere „Veröffentlichen“ im Ortsprofil, um die Besucherseite zu öffnen.",fiche:"Mein Ortsprofil",qr:"Mein QR",pub:"Öffentliches EXPLORE ansehen",share:"Über WhatsApp teilen",hub:"Zurück zum HUB",foot:"0% Provision · direkter Kontakt · öffentliche Daten vom PIN getrennt",migration:"Die EXPLORE-Supabase-Migration muss vor der Synchronisierung ausgeführt werden.",empty:"Für dieses Konto gibt es kein Cloud-Profil. Öffne Mein Ortsprofil, um es zu erstellen.",prepare:"Bereite zuerst dein Ortsprofil vor und speichere es.",publish:"Veröffentliche das Profil vor dem Teilen.",message:"Hallo, hier ist {name} auf DIGIY EXPLORE: {url}",professional:"Profi"},
      it:{eyebrow:"EXPLORE PRO · spazio protetto",hello:"Ciao.",welcome:"Ciao, {name}.",sub:"La scheda del tuo luogo è sincronizzata con Supabase e disponibile sui tuoi dispositivi.",published:"Il tuo luogo è pubblicato e il suo QR individuale è pronto.",draft:"Il luogo è salvato. Attiva «Pubblica» nella scheda per aprire la pagina visitatore.",fiche:"La mia scheda luogo",qr:"Il mio QR",pub:"Vedi EXPLORE pubblico",share:"Condividi su WhatsApp",hub:"Torna all’HUB",foot:"0% commissione · relazione diretta · dati pubblici separati dal PIN",migration:"La migrazione Supabase EXPLORE deve essere eseguita prima della sincronizzazione.",empty:"Nessuna scheda cloud per questo account. Apri La mia scheda luogo per crearla.",prepare:"Prepara e salva prima la scheda del luogo.",publish:"Pubblica la scheda prima di condividerla.",message:"Ciao, ecco {name} su DIGIY EXPLORE: {url}",professional:"professionista"},
      nl:{eyebrow:"EXPLORE PRO · beveiligde ruimte",hello:"Hallo.",welcome:"Hallo, {name}.",sub:"Je plekprofiel is gesynchroniseerd met Supabase en blijft beschikbaar op je apparaten.",published:"Je plek is gepubliceerd en de persoonlijke QR is klaar.",draft:"Je plek is opgeslagen. Activeer ‘Publiceren’ in Mijn plekprofiel om de bezoekerspagina te openen.",fiche:"Mijn plekprofiel",qr:"Mijn QR",pub:"Openbaar EXPLORE bekijken",share:"Delen via WhatsApp",hub:"Terug naar HUB",foot:"0% commissie · direct contact · openbare gegevens gescheiden van de PIN",migration:"De EXPLORE Supabase-migratie moet vóór synchronisatie worden uitgevoerd.",empty:"Geen cloudprofiel voor dit account. Open Mijn plekprofiel om het te maken.",prepare:"Maak en bewaar eerst je plekprofiel.",publish:"Publiceer het profiel voordat je het deelt.",message:"Hallo, hier is {name} op DIGIY EXPLORE: {url}",professional:"professional"},
      ar:{eyebrow:"EXPLORE PRO · مساحة آمنة",hello:"مرحبًا.",welcome:"مرحبًا، {name}.",sub:"ملف مكانك متزامن مع Supabase ويبقى متاحًا على أجهزتك.",published:"تم نشر مكانك ورمز QR الفردي جاهز.",draft:"تم حفظ مكانك. فعّل «نشر» في ملف المكان لفتح صفحة الزوار.",fiche:"ملف مكاني",qr:"رمز QR الخاص بي",pub:"عرض EXPLORE العام",share:"المشاركة عبر واتساب",hub:"العودة إلى HUB",foot:"0% عمولة · علاقة مباشرة · البيانات العامة منفصلة عن رمز PIN",migration:"يجب تنفيذ ترحيل Supabase الخاص بـ EXPLORE قبل المزامنة.",empty:"لا يوجد ملف سحابي لهذا الحساب. افتح ملف مكاني لإنشائه.",prepare:"جهّز ملف المكان واحفظه أولاً.",publish:"انشر الملف قبل مشاركته.",message:"مرحبًا، هذا {name} على DIGIY EXPLORE: {url}",professional:"مهني"}
    };
    let lang="fr",ownerSlug="",ownerPhone="",place=null;
    function t(key){return (COPY[lang]||COPY.fr)[key]||COPY.fr[key]||key}
    function fill(text,vars){return String(text||"").replace(/\{(\w+)\}/g,(_,key)=>String(vars?.[key]??""))}
    function status(message){$("status").textContent=message||"";$("status").hidden=!message}
    function cleanPhone(v){const d=String(v||"").replace(/\D/g,"");return d.length===9?"221"+d:d}
    function render(){
      document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
      document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
      $("eyebrow").textContent=t("eyebrow");$("ficheLink").textContent=t("fiche");$("qrLink").textContent=t("qr");$("publicLink").textContent=t("pub");$("shareWhatsApp").textContent=t("share");$("hubLink").textContent=t("hub");$("foot").textContent=t("foot");
      if(place){$("title").textContent=fill(t("welcome"),{name:place.place_name||t("professional")});$("subtitle").textContent=place.is_published?t("published"):t("draft")}
      else{$("title").textContent=t("hello");$("subtitle").textContent=t("sub")}
      try{localStorage.setItem(STORE,lang)}catch(_){}
    }
    async function boot(){
      try{lang=(localStorage.getItem(STORE)||"fr").slice(0,2)}catch(_){lang="fr"}if(!COPY[lang])lang="fr";render();
      const guard=window.DIGIY_GUARD;
      if(!guard||typeof guard.ready!=="function"){location.replace("./pin.html");return}
      try{await guard.ready()}catch(_){location.replace("./pin.html");return}
      const session=typeof guard.getSession==="function"?guard.getSession():(guard.state||{});
      ownerSlug=String(session?.slug||guard.state?.slug||"").trim().toLowerCase();
      ownerPhone=cleanPhone(session?.phone||guard.state?.phone||"");
      if(!ownerSlug||!ownerPhone){location.replace("./pin.html");return}
      const sb=window.supabase.createClient(window.DIGIY_SUPABASE_URL,window.DIGIY_SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      const {data,error}=await sb.rpc("digiy_explore_get_place_by_owner",{p_owner_slug:ownerSlug,p_phone:ownerPhone});
      if(error){status(t("migration"));return}
      if(data?.ok===true&&data.place){place=data.place;render()}else status(t("empty"));
    }
    document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>{lang=button.dataset.lang;status("");render()}));
    $("shareWhatsApp").addEventListener("click",()=>{
      const url=String(place?.public_url||"").trim();
      if(!url){status(t("prepare"));return}
      if(place?.is_published!==true){status(t("publish"));return}
      const label=place?.place_name||t("professional");
      location.href="https://wa.me/?text="+encodeURIComponent(fill(t("message"),{name:label,url}));
    });
    boot();
  })();
